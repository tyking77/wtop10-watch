# Rebuilds episodes.js (and thumbs/ for new episodes) from the Panopto
# folders listed in data.js, and schedule.js from the Cablecast CSVs in
# schedule/. Commits when something changed; GitHub Pages then redeploys.
name: Update episodes

on:
  schedule:
    # Every 30 minutes, all day
    - cron: "*/30 * * * *"
    # Weeknights around the 9 PM newscast: adds :15 and :45 so it checks
    # every 15 minutes. Cron runs in UTC; 01:00-05:59 UTC Tue-Sat is
    # 9 PM-2 AM Eastern in summer time and 8 PM-1 AM in winter, Mon-Fri.
    - cron: "15,45 1-5 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [episodes.js, schedule.js, "thumbs/**"]

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build-schedule uses each CSV's commit time to decide
          # which export is newest
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg (for thumbnails)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Build episodes.js
        run: node scripts/build-episodes.mjs

      - name: Build schedule.js
        run: node scripts/build-schedule.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- episodes.js thumbs schedule.js)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.js thumbs schedule.js
          git commit -m "Update episodes and schedule"
          git pull --rebase origin main
          git push
