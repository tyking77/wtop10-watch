# Rebuilds episodes.js from the Panopto folders listed in data.js and commits
# it when something changed. GitHub Pages then redeploys the site.
name: Update episodes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [episodes.js]

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build episodes.js
        run: node scripts/build-episodes.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- episodes.js && git ls-files --error-unmatch episodes.js >/dev/null 2>&1; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.js
          git commit -m "Update episodes from Panopto"
          git pull --rebase origin main
          git push
