# Rebuilds episodes.js (and thumbs/ for new episodes) from the Panopto
# folders listed in data.js and commits when something changed. GitHub Pages then redeploys the site.
name: Update episodes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [episodes.js, "thumbs/**"]

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg (for thumbnails)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Build episodes.js
        run: node scripts/build-episodes.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- episodes.js thumbs)" ]; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.js thumbs
          git commit -m "Update episodes from Panopto"
          git pull --rebase origin main
          git push
